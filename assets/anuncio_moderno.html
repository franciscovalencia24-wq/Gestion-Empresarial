<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Aviso Moderno</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            width: 2480px;
            height: 1748px;
            background: linear-gradient(135deg, #092c23 0%, #104b3c 100%);
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Elemento de diseño abstracto en el fondo */
        .bg-shape {
            position: absolute;
            width: 1500px;
            height: 1500px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 70%);
            top: -500px;
            right: -500px;
            border-radius: 50%;
            z-index: 1;
        }

        .container {
            z-index: 2;
            padding: 150px 200px;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 100px;
        }

        .logo {
            background-color: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .logo img {
            width: 600px;
            height: auto;
        }

        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 130px;
            font-weight: 700;
            margin: 0 0 30px 0;
            line-height: 1.1;
            letter-spacing: -2px;
        }

        h2 {
            font-size: 55px;
            font-weight: 300;
            color: #e2e8f0;
            margin: 0;
            border-left: 8px solid #38b2ac;
            padding-left: 30px;
            max-width: 1600px;
            line-height: 1.4;
        }

        .footer {
            margin-top: auto;
            border-top: 2px solid rgba(255,255,255,0.2);
            padding-top: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-item {
            font-size: 40px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .tag {
            background: #ffffff;
            color: #104b3c;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 45px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="bg-shape"></div>
    <div class="container">
        <div class="header">
            <div class="logo">
                <!-- Usar ruta local para el logo -->
                <img src="src/web/assets/NUEVO LOGO FV.png" alt="FV Asesorías">
            </div>
        </div>
        
        <div class="content">
            <h1>DIGITAL FAMILY<br>OFFICE</h1>
            <h2>Arquitectura Tecnológica Aplicada a su Patrimonio. Protegiendo su legado con claridad, tiempo y tranquilidad.</h2>
        </div>

        <div class="footer">
            <div class="contact-info">
                <div class="contact-item">
                    <span>📧 contacto@fv-inversiones.com</span>
                </div>
                <div class="contact-item">
                    <span>📞 +56 9 6677 9662</span>
                </div>
            </div>
            <div class="tag">
                Evolución Continua
            </div>
        </div>
    </div>
</body>
</html>
