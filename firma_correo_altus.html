<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="margin: 0; padding: 0;">
    <!-- Las firmas de correo siempre deben construirse con tablas (TABLE) para que Outlook y Gmail no las rompan -->
    <table cellpadding="0" cellspacing="0" border="0" style="font-family: 'Segoe UI', Arial, sans-serif; max-width: 600px;">
        <tr>
            <!-- Columna Izquierda: Logo Principal FV -->
            <td valign="middle" style="padding-right: 20px;">
                <img src="assets/brand/fv_logo_principal_light.png" alt="FV Asesorías e Inversiones" width="160" style="display: block; width: 160px; height: auto;">
            </td>
            
            <!-- Línea separadora dorada -->
            <td width="2" style="background-color: #D4AF37; padding: 0; min-width: 2px;"></td>
            
            <!-- Columna Derecha: Datos del Asesor -->
            <td valign="middle" style="padding-left: 20px;">
                <table cellpadding="0" cellspacing="0" border="0">
                    <tr>
                        <td style="padding-bottom: 5px;">
                            <span style="font-size: 18px; font-weight: bold; color: #0A2342; margin: 0; padding: 0;">Francisco Valencia</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom: 12px;">
                            <span style="font-size: 13px; font-weight: 600; color: #D4AF37; margin: 0; padding: 0;">Managing Partner | Asesor Financiero Senior</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom: 3px;">
                            <span style="font-size: 13px; color: #4a5568; margin: 0; padding: 0;">&#9993; contacto@fv-inversiones.com</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom: 15px;">
                            <span style="font-size: 13px; color: #4a5568; margin: 0; padding: 0;">&#128222; +56 9 6677 9662</span>
                        </td>
                    </tr>
                    <!-- Badge Altus AI -->
                    <tr>
                        <td style="padding-top: 10px; border-top: 1px solid #e2e8f0;">
                            <table cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td valign="middle" style="padding-right: 8px;">
                                        <span style="font-size: 9px; font-weight: 600; color: #718096; letter-spacing: 2px;">POWERED BY</span>
                                    </td>
                                    <td valign="middle">
                                        <!-- Logo Altus AI -->
                                        <img src="altus_logo_minimalist_1780936005587.png" alt="Altus AI" width="50" style="display: block; width: 50px; height: auto; border-radius: 10px; border: 1px solid #D4AF37;">
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
