
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 2480px;
            height: 1748px;
            zoom: 4;
        }
        
        .ad-container {
            width: 2480px;
            height: 1748px;
            position: relative;
            box-sizing: border-box;
            background: #1a1a1a;
            display: flex;
            border: 2px solid #333;
        }
        
        /* Left Column: Branding */
        .left-col {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 2px solid rgba(255, 255, 255, 0.05);
            padding: 100px;
        }
        
        .logo-img { 
            height: 380px; 
            filter: brightness(0) sepia(1) hue-rotate(10deg) saturate(3) invert(0.8); 
            margin-bottom: 40px; 
            margin-left: 20px;
        }
        
        .fv-text {
            font-size: 36px; 
            font-weight: 500; 
            letter-spacing: 14px; 
            color: #D4AF37; 
            text-align: center;
            white-space: nowrap;
            text-transform: uppercase;
            margin-left: 0;
            margin-top: 10px;
        }
        
        .slogan {
            font-size: 32px;
            font-weight: 300;
            color: #CCC;
            letter-spacing: 4px;
            margin-top: 60px;
            text-align: center;
        }
        
        /* Right Column: Contact Info & QR */
        .right-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 180px 100px 180px 150px;
        }
        
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 60px;
            margin-top: 50px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            font-size: 36px;
            color: #FFF;
            font-weight: 400;
            letter-spacing: 2px;
        }
        
        .contact-icon {
            font-size: 45px;
            color: #D4AF37;
            margin-right: 40px;
            width: 55px;
            text-align: center;
            filter: grayscale(100%) brightness(200%);
            /* Using standard emojis but styled cleanly, or just standard text icons */
        }
        
        /* Bottom Section of Right Column */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 50px;
        }
        
        .altus-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .powered-by { 
            font-size: 20px; 
            font-weight: 600; 
            letter-spacing: 8px; 
            color: #777; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
        }
        
        .altus-logo { 
            height: 320px; 
            filter: brightness(0) invert(1); 
            opacity: 0.9; 
            margin-left: -10px; 
        }
        
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .qr-box {
            width: 250px;
            height: 250px;
            background: white;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        
        .qr-box img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }
        
        .linkedin-cta {
            font-size: 24px;
            color: #D4AF37;
            letter-spacing: 2px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .linkedin-in {
            font-size: 28px;
            font-weight: 800;
        }
        
        .scan-text {
            font-size: 18px;
            color: #777;
            letter-spacing: 4px;
        }

    </style>
</head>
